</div>

  <!-- List Container -->
  <div id="list"></div>
</main>

<footer>SCL List • Geometry Dash Ranking</footer>

<script>
let currentTab = "scl";

const sclLevels = [
  {
    name: "conispidy",
    creator: "capmind",
    difficulty: "Extreme Demon",
    points: 500,
    id: "148967435",
    videoEmbedUrl: "https://www.youtube.com/embed/qYk8IHEsLdI"
  },
  {
    name: "(night)",
    creator: "szymipek",
    difficulty: "Extreme Demon",
    points: 480,
    id: "124930560",
    videoEmbedUrl: "https://www.youtube.com/embed/utrtXEI3HmE"
  }
];

const legacyLevels = [];

function toggleDetails(index) {
  const detailsEl = document.getElementById(`details-${index}`);
  if (detailsEl) {
    detailsEl.classList.toggle("active");
  }
}

function switchList(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const d = document.getElementById("difficulty").value;
  
  const levels = currentTab === 'scl' ? sclLevels : legacyLevels;

  const filtered = levels.filter(x => 
    (x.name + " " + x.creator).toLowerCase().includes(q) && (!d || x.difficulty === d)
  );

  document.getElementById("list").innerHTML = filtered.map((x, i) => `
    <div class="card" onclick="toggleDetails(${i})">
      <div class="card-main">
        <div class="rank">#${i + 1}</div>
        <div>
          <div class="name">${x.name}</div>
          <div class="creator">by ${x.creator}</div>
          <div class="difficulty">${x.difficulty}</div>
        </div>
        <div class="points">${x.points} pts</div>
      </div>
      <div class="details" id="details-${i}">
        <div class="level-id"><strong>Level ID:</strong> ${x.id}</div>
        <div class="video-container">
          <iframe src="${x.videoEmbedUrl}" allowfullscreen></iframe>
        </div>
      </div>
    </div>
  `).join("") || `<p style="text-align:center;color:#8b949e;">No levels found in ${currentTab.toUpperCase()} list.</p>`;
}

document.getElementById("search").oninput = render;
document.getElementById("difficulty").onchange = render;
render();
</script>

</body>
</html
