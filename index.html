<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCL List</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080e14;color:#e6edf3;font-family:Arial,sans-serif}

header{
  padding:28px 18px;
  text-align:center;
  background:linear-gradient(135deg,#0d1926,#132338);
  border-bottom:1px solid #1a365d;
  box-shadow:0 4px 20px rgba(0, 242, 255, 0.05);
}

h1{
  margin:0 0 8px;
  font-size:34px;
  color:#00f2ff;
  text-shadow:0 0 12px rgba(0, 242, 255, 0.3);
}

.sub{color:#7cb3d6}
.wrap{max-width:700px;margin:24px auto;padding:0 14px}

.nav-tabs{display:flex;gap:10px;margin-bottom:18px;border-bottom:1px solid #1a365d;padding-bottom:10px;flex-wrap:wrap}
.tab-btn{
  background:#0d1926;
  color:#7cb3d6;
  border:1px solid #1a365d;
  border-radius:8px;
  padding:10px 18px;
  font-size:16px;
  cursor:pointer;
  font-weight:bold;
  transition:all 0.2s ease;
}
.tab-btn.active,.tab-btn:hover{
  background:#132338;
  color:#00f2ff;
  border-color:#00f2ff;
  box-shadow:0 0 10px rgba(0, 242, 255, 0.2);
}

.rules-box{
  background:#0d1926;
  border:1px solid #1a365d;
  border-radius:10px;
  padding:18px;
  margin-bottom:20px;
}
.rules-box h2{margin-top:0;font-size:20px;color:#00f2ff}
.rules-box ul{margin:0;padding-left:20px;color:#e6edf3;line-height:1.6}

.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
input,select{
  background:#0d1926;
  color:#e6edf3;
  border:1px solid #1a365d;
  border-radius:8px;
  padding:11px 12px;
  font-size:15px;
  outline:none;
  transition:border-color 0.2s;
}
input:focus,select:focus{border-color:#00f2ff}
input{flex:1;min-width:220px}

/* Karta w stylu Pointercrate */
.card{
  background:#0d1926;
  border:1px solid #1a365d;
  border-radius:12px;
  margin:18px 0;
  cursor:pointer;
  overflow:hidden;
  transition:transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}

.card:hover{
  border-color:#00f2ff;
  transform:translateY(-4px);
  box-shadow:0 8px 20px rgba(0, 242, 255, 0.15);
}

.card-thumb-wrap{
  position:relative;
  width:100%;
  height:180px;
  overflow:hidden;
}

.card-thumb{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card-thumb-overlay{
  position:absolute;
  top:0; left:0; right:0; bottom:0;
  background:linear-gradient(to bottom, rgba(13,25,38,0) 40%, #0d1926 100%);
}

.card-body{
  padding:16px 20px 20px;
}

.card-title{
  font-size:22px;
  font-weight:bold;
  color:#ffffff;
  margin-bottom:4px;
}

.card-creator{
  font-size:15px;
  color:#7cb3d6;
  margin-bottom:8px;
}

.card-creator strong{
  color:#e6edf3;
}

.card-points{
  font-size:14px;
  color:#00f2ff;
  font-weight:bold;
}

/* Karta Gracza (Stats Viewer) */
.player-card-main{
  display:grid;
  grid-template-columns:65px 1fr auto;
  gap:16px;
  align-items:center;
  padding:16px;
}
.rank{font-size:25px;font-weight:bold;text-align:center;color:#00f2ff}
.name-container{display:flex;align-items:center;gap:8px}
.name{font-size:18px;font-weight:bold;color:#ffffff}
.flag-icon{width:20px;height:14px;border-radius:2px;object-fit:cover;box-shadow:0 0 4px rgba(0,0,0,0.5)}
.points{font-weight:bold;text-align:right;color:#00f2ff}

/* Widok Poziomu (Dedykowana strona/zakładka) */
#level-view{display:none}
.back-btn{
  display:inline-block;
  background:#0d1926;
  color:#00f2ff;
  border:1px solid #00f2ff;
  border-radius:8px;
  padding:8px 16px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:16px;
  transition:all 0.2s ease;
}
.back-btn:hover{
  background:#00f2ff;
  color:#080e14;
  box-shadow:0 0 10px rgba(0, 242, 255, 0.4);
}

.level-header-title{
  font-size:28px;
  font-weight:bold;
  color:#ffffff;
  margin-bottom:16px;
}

.video-container{
  position:relative;
  padding-bottom:56.25%;
  height:0;
  overflow:hidden;
  border-radius:12px;
  background:#000;
  border:1px solid #1a365d;
  box-shadow:0 4px 20px rgba(0, 0, 0, 0.5);
  margin-bottom:16px;
}
.video-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}

/* Pasek informacji w poziomie pod wideo */
.level-info-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0d1926;
  border:1px solid #1a365d;
  border-radius:10px;
  padding:14px 20px;
  margin-bottom:20px;
  flex-wrap:wrap;
  gap:12px;
}
.info-item{
  display:flex;
  flex-direction:column;
}
.info-label{
  font-size:12px;
  color:#7cb3d6;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.info-value{
  font-size:16px;
  font-weight:bold;
  color:#ffffff;
  margin-top:2px;
}
.info-value.cyan{color:#00f2ff}

.victors-box{
  margin-top:20px;
  padding:18px;
  background:#0d1926;
  border:1px solid #1a365d;
  border-radius:10px;
}
.victors-title{
  font-size:18px;
  font-weight:bold;
  color:#00f2ff;
  margin-bottom:12px;
}

footer{text-align:center;color:#7cb3d6;padding:30px}
</style>
</head>
<body>

<header>
  <h1>SCL List</h1>
  <div class="sub">Geometry Dash Demon Ranking</div>
</header>

<main class="wrap">
  <!-- Nawigacja główna -->
  <div id="main-nav" class="nav-tabs">
    <button class="tab-btn active" onclick="switchList('scl', event)">SCL List</button>
    <button class="tab-btn" onclick="switchList('legacy', event)">Legacy List</button>
    <button class="tab-btn" onclick="switchList('stats', event)">Stats Viewer</button>
  </div>

  <!-- Zasady -->
  <div id="rules-container" class="rules-box">
    <h2>Submission Rules</h2>
    <ul>
      <li>The level must be longer than 5 seconds and less than 30 seconds.</li>
      <li>The level cannot be part of another level (cannot be copied).</li>
      <li>The level cannot contain sensitive words or images.</li>
    </ul>
  </div>

  <!-- Wyszukiwarka i filtry -->
  <div class="controls" id="controls-container">
    <input id="search" placeholder="Search level, creator or player...">
    <select id="difficulty">
      <option value="">All Difficulties</option>
      <option>Extreme Demon</option>
      <option>Insane Demon</option>
      <option>Hard Demon</option>
    </select>
  </div>

  <!-- Główna lista -->
  <div id="list"></div>

  <!-- Dedykowana podstrona poziomu -->
  <div id="level-view">
    <button class="back-btn" onclick="closeLevelView()">← Back to list</button>
    <div id="level-details-content"></div>
  </div>
</main>

<footer>SCL List • Geometry Dash Ranking</footer>

<script>
let currentTab = "scl";

const sclLevels = [
  {
    id: "conispidy",
    rank: 1,
    name: "conispidy",
    creator: "capmind",
    verifier: "capmind",
    difficulty: "Extreme Demon",
    points: 500,
    id_ingame: "148967435",
    videoEmbedUrl: "https://www.youtube.com/embed/qYk8IHEsLdI",
    thumbnail: "https://img.youtube.com/vi/qYk8IHEsLdI/hqdefault.jpg"
  },
  {
    id: "night",
    rank: 2,
    name: "night",
    creator: "szymipek",
    verifier: "szymipek",
    difficulty: "Extreme Demon",
    points: 480,
    id_ingame: "124930560",
    videoEmbedUrl: "https://www.youtube.com/embed/utrtXEI3HmE",
    thumbnail: "https://img.youtube.com/vi/utrtXEI3HmE/hqdefault.jpg"
  }
];

const legacyLevels = [];

// Gracze z kodami flag (de = Niemcy, pl = Polska)
const players = [
  { name: "Capmind", country: "de", completed: [] },
  { name: "Szymipek", country: "pl", completed: [] }
];

function getPlayerPoints(player) {
  let total = 0;
  player.completed.forEach(levelId => {
    const level = sclLevels.find(l => l.id === levelId);
    if (level) total += level.points;
  });
  return total;
}

function openLevelView(levelId) {
  const level = sclLevels.concat(legacyLevels).find(l => l.id === levelId);
  if (!level) return;

  // Ukrywanie elementów listy
  document.getElementById("main-nav").style.display = "none";
  document.getElementById("rules-container").style.display = "none";
  document.getElementById("controls-container").style.display = "none";
  document.getElementById("list").style.display = "none";

  // Generowanie zawartości podstrony poziomu
  const viewContent = document.getElementById("level-details-content");
  viewContent.innerHTML = `
    <div class="level-header-title">#${level.rank} – ${level.name}</div>
    
    <!-- 1. Film YouTube na samej górze -->
    <div class="video-container">
      <iframe src="${level.videoEmbedUrl}" allowfullscreen></iframe>
    </div>

    <!-- 2. Pasek informacji w poziomie -->
    <div class="level-info-bar">
      <div class="info-item">
        <span class="info-label">Publisher / Creator</span>
        <span class="info-value">${level.creator}</span>
      </div>
      <div class="info-item">
        <span class="info-label">Level ID</span>
        <span class="info-value cyan">${level.id_ingame}</span>
      </div>
      <div class="info-item">
        <span class="info-label">Verifier</span>
        <span class="info-value">${level.verifier}</span>
      </div>
    </div>

    <!-- 3. Sekcja Victors -->
    <div class="victors-box">
      <div class="victors-title">Victors</div>
      <p style="color:#7cb3d6;margin:0;font-size:14px;">None yet.</p>
    </div>
  `;

  document.getElementById("level-view").style.display = "block";
  window.scrollTo(0, 0);
}

function closeLevelView() {
  document.getElementById("level-view").style.display = "none";
  document.getElementById("main-nav").style.display = "flex";
  document.getElementById("list").style.display = "block";

  if (currentTab !== 'stats') {
    document.getElementById("rules-container").style.display = "block";
    document.getElementById("controls-container").style.display = "flex";
  } else {
    document.getElementById("controls-container").style.display = "flex";
  }
}

function switchList(tab, e) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  if (e) e.target.classList.add('active');

  closeLevelView();

  const diffSelect = document.getElementById("difficulty");
  const rulesBox = document.getElementById("rules-container");

  if (tab === 'stats') {
    diffSelect.style.display = "none";
    rulesBox.style.display = "none";
  } else {
    diffSelect.style.display = "inline-block";
    rulesBox.style.display = "block";
  }

  render();
}

function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const listEl = document.getElementById("list");

  if (currentTab === 'stats') {
    const sortedPlayers = players
      .map(p => ({ name: p.name, country: p.country, points: getPlayerPoints(p), completed: p.completed }))
      .sort((a, b) => b.points - a.points);

    const rankedPlayers = sortedPlayers.map((p, index) => ({ ...p, rank: index + 1 }));
    const filteredPlayers = rankedPlayers.filter(p => p.name.toLowerCase().includes(q));

    listEl.innerHTML = filteredPlayers.map((p) => `
      <div class="card">
        <div class="player-card-main">
          <div class="rank">#${p.rank}</div>
          <div>
            <div class="name-container">
              <span class="name">${p.name}</span>
              <img class="flag-icon" src="https://flagcdn.com/w40/${p.country}.png" alt="${p.country}">
            </div>
            <div style="color:#7cb3d6;font-size:14px;margin-top:4px;">Completed: ${p.completed.length} level(s)</div>
          </div>
          <div class="points">${p.points} pts</div>
        </div>
      </div>
    `).join("") || `<p style="text-align:center;color:#7cb3d6;">No players found.</p>`;

  } else {
    const d = document.getElementById("difficulty").value;
    const levels = currentTab === 'scl' ? sclLevels : legacyLevels;

    const filtered = levels.filter(x => 
      (x.name + " " + x.creator).toLowerCase().includes(q) && (!d || x.difficulty === d)
    );

    listEl.innerHTML = filtered.map((x) => `
      <div class="card" onclick="openLevelView('${x.id}')">
        <div class="card-thumb-wrap">
          <img class="card-thumb" src="${x.thumbnail}" alt="${x.name}">
          <div class="card-thumb-overlay"></div>
        </div>
        <div class="card-body">
          <div class="card-title">#${x.rank} – ${x.name}</div>
          <div class="card-creator">published by <strong>${x.creator}</strong></div>
          <div class="card-points">${x.points} points</div>
        </div>
      </div>
    `).join("") || `<p style="text-align:center;color:#7cb3d6;">No levels found in ${currentTab.toUpperCase()} list.</p>`;
  }
}

document.getElementById("search").oninput = render;
document.getElementById("difficulty").onchange = render;
render();
</script>

</body>
</html>
